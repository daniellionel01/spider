name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - spider_core
          - spider_extension
          - spider_js
          - spider_server
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.dir }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.0.0"
          gleam-version: "1.13.0"
          rebar3-version: "3"
          # elixir-version: "1"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
